name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: chave-somente-para-ci
      DEBUG: "True" # Necessario diante o settings.py exige e-mail SMTP
      # Sem DATABASE_URL, o Django usa SQLite (suficiente para os testes)

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar o projeto
        run: python manage.py check

      - name: Coletar arquivos estáticos (build)
        run: python manage.py collectstatic --noinput

      - name: Rodar migrações
        run: python manage.py migrate --noinput

      - name: Rodar testes automatizados
        run: python manage.py test --verbosity 2