{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            ESG no Ramo Alimentício
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header class="site-header">
        <div class="container header-content">
            <a class="logo" href="{% url 'home' %}">
                ESG Alimentício
            </a>

            <nav class="main-nav">
                <a href="{% url 'home' %}">Início</a>
                <a href="{% url 'sobre' %}">O Projeto</a>
                <a href="{% url 'desafios' %}">Desafios</a>
                <a href="{% url 'equipe' %}">Quem Somos</a>
                <a href="{% url 'contato' %}">Contato</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                Projeto acadêmico sobre ESG no ramo alimentício.
            </p>

            <p>
                &copy; 2026 - ESG Alimentício
            </p>
        </div>
    </footer>

</body>
</html>
